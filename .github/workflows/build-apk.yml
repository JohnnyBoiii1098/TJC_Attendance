name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix Git Permissions
      run: git config --global --add safe.directory '*'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    # FIX: Piped 'yes' to automatically answer 'y' to Flet's SDK installation prompt!
    - name: Build Android APK
      run: |
        yes | flet build apk --project "tjc_attendance" --product "TJC Attendance" -v

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tjc-attendance-apk
        path: build/apk/*.apk