name: Build Flet APK

on:
  push:
    branches: [ main, master ] # Triggers whenever you push code changes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # --- THE FIX: Bypass GitHub's strict directory ownership security ---
    - name: Fix Git Permissions for Flet
      run: git config --global --add safe.directory '*'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Build Android APK
      run: |
        flet build apk --project "TJC_Attendance" --product "TJC Attendance" --permissions internet

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tjc-attendance-apk
        path: build/apk/app-release.apk