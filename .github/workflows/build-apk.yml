name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Fix 1: Updated to v5 to clear the setup-java deprecation warning
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fix Git Permissions
      run: git config --global --add safe.directory '*'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    # Fix 2: Flet requires the entry point to be explicitly named 'main.py'
    - name: Rename script for Flet
      run: mv TJC_Attendance.py main.py

    # Fix 3: Removed invalid arguments to resolve Exit Code 2
    - name: Build Android APK
      run: |
        flet build apk --project-name "tjc_attendance" --product "TJC Attendance"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tjc-attendance-apk
        path: build/apk/app-release.apk