name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Pre-install Java (Required for Android builds)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. Pre-install Flutter (Bypasses Flet's internal git clone)
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 3. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. Fix Git Permissions (Safety fallback)
    - name: Fix Git Permissions
      run: git config --global --add safe.directory '*'

    # 5. Install Python dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    # 6. Build the APK (Will now use the pre-installed Flutter SDK)
    - name: Build Android APK
      run: |
        flet build apk --project "TJC_Attendance" --product "TJC Attendance" --permissions internet

    # 7. Upload the final file
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tjc-attendance-apk
        path: build/apk/app-release.apk